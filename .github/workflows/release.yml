name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:\+([1-9][0-9]*))?', tag)
          if not match:
              raise SystemExit('Use a stable vMAJOR.MINOR.PATCH tag, optionally +BUILD (positive integer)')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APP_VERSION={match[1]}\nAPP_BUILD={match[2] or "1"}\n')
          PY
      - name: Test
        run: >-
          xcodebuild test -project ArkServer.xcodeproj -scheme ArkServer
          -destination 'platform=macOS' -only-testing:ArkServerTests
          -derivedDataPath "$RUNNER_TEMP/ArkServerDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Build universal release
        run: >-
          xcodebuild build -project ArkServer.xcodeproj -scheme ArkServer
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ArkServerRelease"
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD"
          CODE_SIGNING_ALLOWED=NO
      - name: Package app
        run: |
          codesign --force --deep --sign - "$RUNNER_TEMP/ArkServerRelease/Build/Products/Release/ArkServer.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ArkServerRelease/Build/Products/Release/ArkServer.app" ArkServer.app.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" ArkServer.app.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
