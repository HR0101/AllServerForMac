name: macOS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test MediaServerKit
        working-directory: Packages/MediaServerKit
        run: swift test

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project AllServerForMac.xcodeproj
          -scheme AllServerForMac

      - name: Build macOS app
        run: >-
          xcodebuild build
          -project AllServerForMac.xcodeproj
          -scheme AllServerForMac
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/AllServerForMacDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Test macOS app
        run: >-
          xcodebuild test
          -project AllServerForMac.xcodeproj
          -scheme AllServerForMac
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/AllServerForMacDerivedData"
          CODE_SIGNING_ALLOWED=NO
